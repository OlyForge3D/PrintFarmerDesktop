[package]
name = "model-core"
description = "PrintFarmer Desktop sidecar: scanning, hashing, SQLite catalog, and 3D model parsing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "model-core"
path = "src/main.rs"

[lib]
name = "model_core"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
notify = "8"
# ZIP with only the pure-Rust deflate (miniz_oxide) backend. Default features
# (bzip2, zstd) pull in C libraries and must stay disabled so 3MF reading builds
# without a C toolchain.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
serde_json = "1"
# Pure-Rust PNG encoder (miniz_oxide/fdeflate backend) for GPU-free thumbnail
# rendering; no C toolchain required.
png = "0.17"
# Pure-Rust base64 for shipping encoded thumbnails over the JSON-RPC transport.
base64 = "0.22"
# C-backed bundled SQLite, compiled only where a C toolchain is available.
# Gated behind the `sqlite` feature so the default build stays pure-Rust.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
truck-meshalgo = { version = "0.4", optional = true }
truck-stepio = { version = "0.3", optional = true }
truck-topology = { version = "0.6", optional = true }

[features]
# Enables the persistent SQLite-backed catalog store (requires a C toolchain).
sqlite = ["dep:rusqlite"]
# Enables experimental STEP tessellation via the pure-Rust truck CAD kernel.
step = [
    "dep:truck-meshalgo",
    "dep:truck-stepio",
    "dep:truck-topology",
]

[dev-dependencies]
tempfile = "3"
