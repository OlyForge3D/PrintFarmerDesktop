[package]
name = "model-core"
description = "PrintFarmer Desktop sidecar: scanning, hashing, SQLite catalog, and 3D model parsing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "model-core"
path = "src/main.rs"

[lib]
name = "model_core"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
notify = "8"
# ZIP with only the pure-Rust deflate (miniz_oxide) backend. Default features
# (bzip2, zstd) pull in C libraries and must stay disabled so 3MF reading builds
# without a C toolchain.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"

[dev-dependencies]
tempfile = "3"
