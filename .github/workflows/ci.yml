name: CI

on:
  push:
    branches: [development, main]
  pull_request:

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Verify pinned target profiles
        run: npm run verify:target-profiles

      - name: Test
        run: npm run test

  sidecar:
    name: Sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (sqlite feature)
        run: cargo clippy --all-targets --features sqlite -- -D warnings

      - name: Test
        run: cargo test

      - name: Test (sqlite feature)
        run: cargo test --features sqlite

  package:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build sidecar (release)
        working-directory: native
        run: cargo build --release -p model-core --features sqlite

      - name: Package app (bundles the prebuilt sidecar)
        env:
          # The sidecar is built in the dedicated step above; the packaging
          # hook only needs to stage it.
          PRINTFARMER_SKIP_SIDECAR_BUILD: '1'
        run: npm run package

      - name: Verify packaged resources
        run: node scripts/verify-packaged-sidecar.mjs

      - name: Packaged Electron end-to-end tests
        run: npx playwright test
