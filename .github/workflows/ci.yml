name: CI

# merge-queue: reports
#
# Subscribes to merge_group, so its check runs report for a queued entry. This
# is the only class whose contexts may appear in a branch ruleset. See #122 for
# what happens otherwise. scripts/check-merge-queue-contexts.mjs holds that
# classification, enforced on every pull request by tests/mergeQueueReadiness.test.ts
# under `npm run test`; its comparison against live branch protection is wired
# into the "Check merge-queue required contexts against live branch
# protection" step in the `advisories` job below (#186, #472 — that
# comparison used to have no call site at all). That step only actually
# compares once a MERGE_QUEUE_CONTEXTS_TOKEN secret with repo-admin read is
# configured — GITHUB_TOKEN cannot read branch protection regardless of
# `permissions:` grants — and reports that precondition plainly otherwise;
# see the step's own comment for why. It also only ever runs on `push`, never
# on `pull_request`/`merge_group`, because that secret is repo-admin-scoped
# and this job checks out whatever triggered it with no `ref:` override — on
# a pull_request/merge_group event that checkout is PR-authored content, and
# handing it a repo-admin secret would let a PR redefine the very npm script
# being invoked to exfiltrate that secret (Vasquez + Ripley, PR #661 review
# round 4). See the step's own comment for the full reasoning. It also only
# ever runs on a push to `development` specifically — `main` is not a real
# branch in this repo and was removed from the push trigger below (line 26,
# PR #661 review round 5) for the same reason; the step also carries its own
# `github.ref == 'refs/heads/development'` guard as redundant defense in
# depth. See the trigger's and the step's own comments for the full
# reasoning.

on:
  push:
    # `main` was dropped from this list (Vasquez, PR #661 review round 5,
    # Ralph independently confirmed via `gh api .../branches/main` -> 404):
    # this repo's live default/protected branch is `development`; `main` is
    # not a real branch yet, just a name. Listing it here meant anyone with
    # push access could create a branch literally named `main` and push
    # attacker-controlled content straight to it, bypassing PR review, and
    # this workflow — including the privileged merge-queue-contexts step —
    # would still run over that push. The step already carries its own
    # `github.ref == 'refs/heads/development'` guard (added for the same
    # finding, see that step's comment) as defense in depth; narrowing the
    # trigger itself removes the exposure at its source instead of relying
    # solely on the step-level check. Re-add `main` here only once it exists
    # as a real branch with its own protection rules.
    branches: [development]
  pull_request:
  # GitHub dispatches `merge_group` only when a merge queue is enabled. That has
  # happened: two entries were dispatched on 2026-08-04 against base db03fbf1,
  # 54 seconds apart, and both were cancelled --
  #
  #   30889162530  gh-readonly-queue/development/pr-227-db03fbf1  07:46:33Z
  #   30889221719  gh-readonly-queue/development/pr-221-db03fbf1  07:47:27Z
  #
  # `required_merge_queue` is absent from branch protection now, so the queue
  # was enabled, dispatched those two, and was turned off again. What cancelled
  # them is not established and this comment does not guess; ci.yml declared no
  # `concurrency:` at the time, so it was not this file.
  #
  # The previous wording here read "Inert until a merge queue exists", which is
  # defensible as written but reads as "this branch has never executed" -- and a
  # reviewer relied on it and stated a false premise. Without this trigger a
  # queued entry's required contexts are never reported and the queue hangs
  # rather than fails. See tests/ciWorkflowTriggers.test.ts.
  merge_group:

concurrency:
  # Unique per pull request AND per merge-queue entry, as before: `github.ref`
  # is `refs/pull/N/merge` for a pull_request, and
  # `refs/heads/gh-readonly-queue/<base>/pr-N-<sha>` for a merge_group, so two
  # queued entries never share a group and cannot cancel one another -- the
  # failure mode tests/ciWorkflowTriggers.test.ts bans the unkeyed form for.
  #
  # `github.event_name` is now also part of the key (#555). It was not before:
  # `ci-${{ github.ref }}` keys purely on the ref, and at the time #555 was
  # fixed the push trigger below (line 26) still listed both `development`
  # and `main`, so for every push to either one that ref was the same
  # (`refs/heads/development`, `refs/heads/main`), and all trunk-push runs
  # shared one group. `main` has since been dropped from the push trigger
  # (PR #661 review round 5 — see that trigger's own comment), so this
  # collision is now moot for the branch list as currently configured, but
  # `github.sha` staying in the key is still correct: it is what keeps any
  # future re-addition of a second push branch, or any other same-ref
  # collision, from silently reintroducing the eviction bug #555 fixed.
  # `cancel-in-progress: false` only protects the run that is *in progress*; it
  # does not protect a run that is *pending*. GitHub cancels a previously
  # pending run in a group outright when a third run queues behind it,
  # regardless of `cancel-in-progress` -- that eviction is not conditioned on
  # this flag at all. Three quick pushes to trunk (A running, B pending, C
  # queuing) evict B with no conclusion, so no CI result for commit B ever
  # exists.
  #   Before: group(push A) == group(push B) == group(push C)
  #           == `ci-refs/heads/development`
  #   After:  group(push A) == `ci-push-refs/heads/development-<sha_A>`
  #           group(push B) == `ci-push-refs/heads/development-<sha_B>`
  #           all distinct, so none can evict another.
  # `github.sha` is folded into the key for every non-pull_request event, so
  # every push and every merge_group entry gets its own group and can never
  # collide with -- or evict -- another run, of any trigger type, including
  # another run of the *same* trigger type. A pull_request's group
  # intentionally still varies only by ref (not sha): a new commit on the same
  # PR keeps the same group on purpose, so `cancel-in-progress: true` below
  # can supersede the stale run.
  group: ci-${{ format('{0}-{1}-{2}', github.event_name, github.ref, github.event_name != 'pull_request' && github.sha || '') }}
  # Only a pull_request run may be cancelled. A merge_group entry must reach a
  # conclusion: `cancelled` is not a success conclusion, so cancelling one
  # evicts the entry from the queue for a reason unrelated to its own changes.
  # Push runs on the long-lived branches are release inputs and are likewise
  # never cancelled -- and, as of #555, never even queued behind one another in
  # the same group, so there is nothing pending for GitHub to evict either.
  # Superseding a stale pull_request run is the entire point: without it a run
  # that is still in flight when its head is replaced still publishes a green,
  # and that green is attributed to a commit that is no longer the head (#405).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Documentation-only fast path.
#
# PR #596 changed one markdown file, `.squad/agents/ralph/loop.md`, and ran the
# whole matrix: 9m44s + 8m8s + 5m48s + 5m3s + 4m36s + 4m3s + 3m26s, ~41 minutes
# of platform build compute to validate a prose edit.
#
# It is gated at STEP level, and the two available alternatives are both unsafe
# here rather than merely worse:
#
#   `paths-ignore:` / workflow-level path filtering suppresses the WORKFLOW, so
#   the eight required contexts on `development` are never reported and the pull
#   request sits at "Expected - waiting for status" forever. Unmergeable, which
#   is worse than slow.
#
#   A job-level `if:` reports a `skipped` conclusion, and branch protection
#   counts `skipped` as success -- so the required check is satisfied by a job
#   that never ran. That is a false green, and 'declares no job-level `if:` and
#   no event-name branching' in tests/ciWorkflowTriggers.test.ts already bans it.
#
# So every job below still runs, under its exact existing name, and reaches a
# real `success` conclusion. Only steps a prose edit cannot affect stand down.
# `scripts/docs-only-change.mjs` decides, and resolves every uncertainty toward
# the full build.
#
# Docs-and-tests tier (#623).
#
# A change confined to documentation and `tests/` needs the test run --
# `Desktop`'s `Test` step is a documentation check in its own right, see the
# comment on the `Format check` / `Test` steps below -- but it cannot affect
# the sidecar, the packaged release build, or the dependency set. PR #620
# changed one PR_CLOSES.md line, one decisions.md entry and added a 192-line
# test file, and ran the full matrix anyway: ~30 minutes of `Sidecar`,
# `Release package` and `Dependency advisories` compute with no signal.
#
# `docs_and_tests` (from the same `scripts/docs-only-change.mjs` step) is a
# SUPERSET of `docs_only`: every path `docs_only` admits, `docs_and_tests`
# admits too, plus anything under `tests/`. That containment is why `Desktop`
# below is untouched by this tier -- its heavy steps already gate on
# `docs_only` alone, and a change that is docs-and-tests but not docs-only, by
# construction, contains a `tests/` file, so `docs_only` is already `false`
# and those steps already run. Only `Sidecar`, `Release package` and
# `Dependency advisories` gain a second condition, `docs_and_tests != 'true'`,
# alongside their existing `docs_only != 'true'`: standing down on EITHER
# tier, exactly as `Desktop` already does for `docs_only` alone. The manifest
# denylist in `scripts/docs-only-change.mjs` is shared by both predicates, so
# a dependency manifest can reach neither tier.
#
# Rust-untouched tier (#707).
#
# The two tiers above are both nested inside "this change is documentation".
# Neither helps the ordinary case: a pull request that edits TypeScript. Over
# the twenty pull requests preceding this change, NINETEEN touched no Rust at
# all, and every one of them paid for a full two-platform cargo matrix --
# toolchain install, `cargo fmt`, three clippy passes, four `cargo test`
# invocations and the Windows lib3mf build. That is 13,608 job-seconds of
# `Sidecar` compute across those nineteen, and it is not merely billed but
# felt: on PR #697 -- seven files, none of them Rust -- `Sidecar
# (windows-latest)` ran 982 seconds and was the LONGEST job in the run, the
# wall-clock critical path deciding when the pull request could merge, while
# compiling a crate the change never reached.
#
# So this tier is orthogonal to the other two rather than nested in them, and
# it answers a question about the build's inputs rather than about a file's
# genre: can this change reach the cargo build at all? `native/**`, any `.rs`
# file anywhere, `Cargo.toml`/`Cargo.lock` anywhere, anything under a
# `.cargo/` directory, the rustfmt/clippy/toolchain configs
# (`rustfmt.toml`, `clippy.toml`, `rust-toolchain.toml` and their dot-prefixed
# spellings) anywhere, this workflow file, and the detector script itself all
# answer yes. Everything else -- `src/`, `tests/`, `e2e/`, `scripts/`,
# `.squad/` -- cannot, because `cargo` never reads them.
#
# The tool-config half of that list is there because of a false negative Ripley
# found in review of PR #708: those files change what `cargo fmt --check` and
# `cargo clippy -- -D warnings` actually enforce, and which compiler runs,
# without appearing in any crate source or manifest. A change to one can turn
# this matrix from green to red while touching no `.rs` file, so classifying it
# as unable to reach the build would stand the job down on exactly the change
# that needed it. None of them exists in this repository yet, which is the
# reason to handle them now: the predicate is wrong on the commit that ADDS
# one.
#
# It gates `sidecar` only. `package` also builds the sidecar, but it goes on
# to package the Electron app and drive Playwright over the result, so a
# TypeScript change reaches it and it keeps running. See
# `classifyRustUntouched` in scripts/docs-only-change.mjs for why the three
# conditions on each `sidecar` step are composed rather than collapsed.
jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      # depth 2, not the default 1: the docs-only detector diffs the
      # `refs/pull/N/merge` commit against its first parent, so it needs both.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect documentation-only change
        id: changes
        run: node scripts/docs-only-change.mjs

      # These three carry the same platform guard as `Format check` and `Test`
      # below, and for one reason: on a documentation-only change those two are
      # the only steps left in this job that do anything, so installing a
      # toolchain and a dependency tree on macOS to run neither of them is the
      # whole cost this guard exists to remove. Gated together or the guard is
      # cosmetic -- `npm ci` alone is the larger half of what a stood-down
      # macOS job would still pay.
      #
      # `Git hooks armed` reads what `npm ci`'s `prepare` armed, so it cannot
      # outlive the install: it must carry the identical condition, not a
      # weaker one, or it fails on the very runs the install skipped.
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.docs_only != 'true' || runner.os == 'Windows'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: npm_ci
        if: steps.changes.outputs.docs_only != 'true' || runner.os == 'Windows'
        env:
          NPM_CLEANUP_EVIDENCE_PATH: ${{ runner.temp }}/npm-cleanup-evidence.json
        run: node scripts/npm-ci-strict.mjs

      - name: Upload npm cleanup failure evidence
        if: failure() && steps.npm_ci.outputs.cleanup_evidence == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-cleanup-evidence-${{ github.job }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-cleanup-evidence.json
          if-no-files-found: error
          retention-days: 90

      # `prepare` (which just ran as part of `npm ci` above) is the only event
      # that arms this checkout's git hooks. This step is the one place that
      # event is verified rather than just trusted -- `hooks:verify` reads
      # `core.hooksPath` and the hook file back off the filesystem and fails
      # the job if either is missing (#382). It answers only for THIS single
      # checkout: a CI runner is always exactly one worktree, so this cannot
      # and does not stand in for `check:hooks-coverage`, which answers the
      # separate, un-CI-able question of whether every worktree of a
      # developer's clone is armed (see that script's own header for why it
      # is deliberately not wired in here).
      - name: Git hooks armed
        if: steps.changes.outputs.docs_only != 'true' || runner.os == 'Windows'
        run: npm run hooks:verify

      - name: Calibration provenance
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run check:provenance

      - name: Target profile bundle
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run verify:target-profiles

      - name: Script reachability
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run check:script-reachability

      - name: Type-check
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

      # Format check and Test are not gated on `docs_only` at all, and the reason
      # is measured rather than cautious. `prettier --check .` covers markdown
      # and caught a real failure on docs PR #577. `vitest run` is a
      # documentation check in this repository as much as a code one: 16 files
      # under tests/ read `.md` or `.squad/` paths and assert their contents --
      # the CI-context list in `.squad/skills/testing/SKILL.md`, the calibration
      # runbook references, the licensing text. Skipping them on a documentation
      # change would remove cover from precisely the change that needs it.
      #
      # They are, however, gated on the PLATFORM for a documentation change, and
      # that is a different question from whether to run them at all. Both are
      # content assertions: `prettier --check` compares bytes against a
      # formatter that is pinned in `package-lock.json`, and the docs-reading
      # tests read repository files and assert what is in them. Neither consults
      # the host OS, so running them a second time on macOS for a prose edit
      # re-answers a question already answered -- ~220 job-seconds per docs-only
      # pull request, on the more expensive of the two runners, for a result
      # that cannot differ.
      #
      # Windows is the half that is kept, not an arbitrary pick. It is the
      # stricter host for exactly these two checks: it is where a line-ending or
      # path-separator regression in a markdown file or a docs-reading test
      # surfaces, so if the two platforms ever were to disagree on a prose
      # change, Windows is the one that would say so.
      #
      # This applies to `docs_only` alone. A `docs_and_tests` change contains a
      # `tests/` file by construction, which is real code that has never been
      # run on either platform before, so it keeps the full two-platform matrix.
      - name: Format check
        if: steps.changes.outputs.docs_only != 'true' || runner.os == 'Windows'
        run: npm run format

      - name: Test
        if: steps.changes.outputs.docs_only != 'true' || runner.os == 'Windows'
        run: npm run test

  sidecar:
    name: Sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # `working-directory:` overrides the job default above; the detector reads
      # the repository, not the crate.
      - name: Detect documentation-only change
        id: changes
        working-directory: ${{ github.workspace }}
        run: node scripts/docs-only-change.mjs

      - name: Install Rust
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true' && steps.changes.outputs.rust_untouched != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true' && steps.changes.outputs.rust_untouched != 'true'
        run: cargo fmt --check

      - name: Clippy
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true' && steps.changes.outputs.rust_untouched != 'true'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (sqlite feature)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true' && steps.changes.outputs.rust_untouched != 'true'
        run: cargo clippy --locked --all-targets --features sqlite -- -D warnings

      - name: Clippy (step feature)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true' && steps.changes.outputs.rust_untouched != 'true'
        run: cargo clippy --locked --all-targets --features step -- -D warnings

      - name: Test
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true' && steps.changes.outputs.rust_untouched != 'true'
        run: cargo test --locked

      - name: Test (sqlite feature)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true' && steps.changes.outputs.rust_untouched != 'true'
        run: cargo test --locked --features sqlite

      - name: Test (step feature)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true' && steps.changes.outputs.rust_untouched != 'true'
        run: cargo test --locked --features step

      - name: Build (lib3mf feature)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true' && steps.changes.outputs.rust_untouched != 'true' && runner.os == 'Windows'
        run: cargo build --locked --features lib3mf

      - name: Test (lib3mf feature)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true' && steps.changes.outputs.rust_untouched != 'true' && runner.os == 'Windows'
        run: cargo test --locked --features lib3mf

  package:
    name: Release package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect documentation-only change
        id: changes
        run: node scripts/docs-only-change.mjs

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        id: npm_ci
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        env:
          NPM_CLEANUP_EVIDENCE_PATH: ${{ runner.temp }}/npm-cleanup-evidence.json
        run: node scripts/npm-ci-strict.mjs

      - name: Upload npm cleanup failure evidence
        if: failure() && steps.npm_ci.outputs.cleanup_evidence == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-cleanup-evidence-${{ github.job }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-cleanup-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Build sidecar (release)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        working-directory: native
        run: cargo build --locked --release -p model-core --features sqlite

      - name: Package app (bundles the prebuilt sidecar)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        env:
          # The sidecar is built in the dedicated step above; the packaging
          # hook only needs to stage it.
          PRINTFARMER_SKIP_SIDECAR_BUILD: '1'
          # Dialog responses are compiled into CI-only packages so ordinary
          # release packages cannot enable automation through the environment.
          PRINTFARMER_BUILD_E2E: '1'
        run: npm run package

      - name: Verify SBOM reproduces from the lockfiles
        # Runs here rather than in `desktop` because this is the only job with
        # both toolchains, so it is the only one where the cargo half of the
        # SBOM is derived from a real `cargo metadata` resolution at the
        # feature set a release builds.
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        run: npm run verify:sbom

      - name: Verify third-party licence policy
        # Deterministic gate: every shipped component's licence must be
        # compatible with the AGPL-3.0-only outbound licence or hold a reviewed
        # exception. Reads the SBOM `npm run package` staged above.
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        run: npm run verify:licenses

      - name: Verify third-party notices reproduce from the SBOM
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        run: npm run verify:notices

      - name: Verify packaged sidecar and compliance resources
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        run: node scripts/verify-packaged-sidecar.mjs

      # The only integration-level check of the real sidecar contract: spawns
      # the staged binary from the "Package app" step above and drives it over
      # the real newline-delimited JSON-RPC transport (handshake -> loadScene
      # -> scanRoot -> listModels -> tags -> collections). Runs here rather
      # than in `desktop` because this job is the one that already builds and
      # stages a real release sidecar binary; `desktop` never installs a Rust
      # toolchain at all. See issue #300.
      - name: MVP smoke test (real sidecar over real transport)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        run: node scripts/mvp-smoke.mjs

      - name: Verify committed lockfiles are unchanged
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        run: git diff --exit-code -- native/Cargo.lock package-lock.json

      - name: Packaged Electron end-to-end tests
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        run: npx playwright test --grep-invert "@gpu|@a11y"

      - name: Packaged accessibility (material WCAG A/AA)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        run: npx playwright test e2e/release.accessibility.spec.ts

      - name: Packaged WebGL2 (host default capability report)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        env:
          PRINTFARMER_E2E_GPU_MODE: default
        run: npx playwright test e2e/release.gpu.spec.ts

      - name: Packaged WebGL2 (SwiftShader fallback)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        env:
          PRINTFARMER_E2E_GPU_MODE: swiftshader
        run: npx playwright test e2e/release.gpu.spec.ts

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      # Safe to stand down on documentation only because the docs-only rule
      # cannot admit a manifest: `scripts/docs-only-change.mjs` rejects
      # package.json, package-lock.json, Cargo.toml and Cargo.lock by basename
      # before it consults the allowlist, so nothing that can change the
      # dependency set can reach this branch.
      - name: Detect documentation-only change
        id: changes
        run: node scripts/docs-only-change.mjs

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        run: cargo install cargo-audit --locked

      - name: Install dependencies
        id: npm_ci
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        env:
          NPM_CLEANUP_EVIDENCE_PATH: ${{ runner.temp }}/npm-cleanup-evidence.json
        run: node scripts/npm-ci-strict.mjs

      - name: Upload npm cleanup failure evidence
        if: failure() && steps.npm_ci.outputs.cleanup_evidence == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-cleanup-evidence-${{ github.job }}-single-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-cleanup-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Generate SBOM (scopes advisories to what ships)
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        run: npm run sbom

      # Report mode by design (see docs/security/THREAT_MODEL.md T4.2): advisory
      # databases are fetched live, so a newly published advisory must not
      # retroactively fail an unrelated pull request. Findings surface as
      # `::warning::` annotations and the job stays green. An inability to run
      # the audit — tool missing, unparseable output, registry unreachable —
      # still fails the job loudly rather than passing in silence. Before either
      # audit runs, the gate independently walks feature-resolved cargo metadata
      # and requires its exact name@version set to match the generated SBOM.
      - name: Audit shipped dependencies for known advisories
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true'
        run: npm run audit:advisories

      # #186 / #472: runs the live half of scripts/check-merge-queue-contexts.mjs
      # — comparing the check-run names this workflow (and the two others
      # that report under merge_group) emit against development's actual
      # required branch-protection contexts. `evaluateWorkflowClassification`
      # (the offline half, deterministic) already runs under `npm run test`
      # via tests/mergeQueueReadiness.test.ts; before this step existed, four
      # workflow header comments described the live half as enforced and
      # nothing invoked it (measured exactly by
      # tests/enforcementCitations.test.ts).
      #
      # GET /repos/{owner}/{repo}/branches/{branch}/protection requires the
      # calling token to have repo-admin read access, and there is no
      # `administration` key in the `permissions:` block available to
      # GITHUB_TOKEN (`administration: read` was tried here and rejected the
      # whole workflow at load time — Hicks, PR #661 review, run 31313684210
      # — GITHUB_TOKEN cannot be granted this regardless of what the
      # `permissions:` block says, since it isn't one of the scopes that
      # block accepts).
      #
      # `github.event_name == 'push'` is load-bearing, not incidental: this
      # step is the only one in this job that receives a repo-admin-scoped
      # secret (MERGE_QUEUE_CONTEXTS_TOKEN), and `actions/checkout@v4` above
      # (no `ref:` override) checks out whatever triggered the run. On a
      # `pull_request` or `merge_group` event that is PR-authored content —
      # `npm run check:merge-queue-contexts` resolves the `check:*` script
      # name and scripts/check-merge-queue-contexts.mjs's contents from that
      # checkout, so a PR could redefine either to exfiltrate the token
      # (Vasquez + Ripley, PR #661 review round 4: same finding,
      # independently). Restricting to `push` means this step only ever runs
      # over already-merged, already-reviewed content on `development` — the
      # same trust boundary `pull_request_target` vs `pull_request` exists to
      # draw, achieved here by gating on event name instead of switching
      # triggers for the whole job. The practical effect: this check no
      # longer runs as a per-PR gate, only after merge — which matches how it
      # is written (`continue-on-error: true`, a report, not a block) and is
      # the same discharge path already named for check:protection-assumptions
      # in check-script-reachability.mjs ("wire it into a scheduled workflow
      # the moment a privileged token exists"); this is that token's job
      # arriving with it, on push instead of a schedule, since one already had
      # to exist for this job to run at all. Until MERGE_QUEUE_CONTEXTS_TOKEN
      # is provisioned, the guard below still reports the precondition rather
      # than silently succeeding. `continue-on-error` keeps either outcome
      # from taking the required "Dependency advisories" context down with it.
      #
      # `github.ref == 'refs/heads/development'` is a second, independent gate
      # on top of `event_name == 'push'` (Vasquez, PR #661 review round 5):
      # the top-level `on.push.branches` trigger (line 26) used to list both
      # `development` and `main`, but `main` did not exist in this repo at the
      # time (`gh api repos/OlyForge3D/PrintFarmerDesktop/branches/main` ->
      # 404, confirmed live). Any actor with push access could have created a
      # `main` branch and pushed attacker-controlled content directly to it,
      # bypassing PR review entirely — that push would still have satisfied
      # `event_name == 'push'`, and `actions/checkout@v4` would have checked
      # out exactly that unreviewed content, handing it the token. Two things
      # closed this, deliberately redundant with each other: `main` was
      # dropped from the `on.push.branches` list itself (line 26, this same
      # round), removing the exposure at its source; this step's own
      # `github.ref` check is kept as well, so even if `main` (or any other
      # branch) is later re-added to the trigger, this specific step still
      # will not run over a push to it until this condition is deliberately
      # revisited. `development` is where this repo's actual review gate
      # (this PR's own merge queue) lives.
      - name: Check merge-queue required contexts against live branch protection
        if: steps.changes.outputs.docs_only != 'true' && steps.changes.outputs.docs_and_tests != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/development'
        continue-on-error: true
        env:
          MERGE_QUEUE_CONTEXTS_TOKEN: ${{ secrets.MERGE_QUEUE_CONTEXTS_TOKEN }}
        run: |
          if [ -z "$MERGE_QUEUE_CONTEXTS_TOKEN" ]; then
            echo "::warning::MERGE_QUEUE_CONTEXTS_TOKEN is not set, so the live half of scripts/check-merge-queue-contexts.mjs cannot run here. GITHUB_TOKEN cannot read branch protection (GitHub requires repo-admin read for that endpoint, and 'administration' is not a valid GITHUB_TOKEN permissions key). Add a PAT or GitHub App installation token with admin:read on this repo as the MERGE_QUEUE_CONTEXTS_TOKEN secret to make this step compare live required contexts."
            exit 0
          fi
          GITHUB_TOKEN="$MERGE_QUEUE_CONTEXTS_TOKEN" npm run check:merge-queue-contexts
