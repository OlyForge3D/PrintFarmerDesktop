name: CI

# merge-queue: reports
#
# Subscribes to merge_group, so its check runs report for a queued entry. This
# is the only class whose contexts may appear in a branch ruleset. See #122 for
# what happens otherwise. scripts/check-merge-queue-contexts.mjs holds that
# classification, enforced on every pull request by tests/mergeQueueReadiness.test.ts
# under `npm run test`; its comparison against live branch protection needs a
# token and is run by hand (#472).

on:
  push:
    branches: [development, main]
  pull_request:
    # `edited` is not in GitHub's default set (opened, synchronize, reopened),
    # and the PR body is the input the closing-reference check reads -- both
    # the declaration and the armed references derive from it. Without this,
    # a PR passes the check at open and can then be edited to arm anything at
    # all without the gate running again: the one field the check is about is
    # the one field that did not retrigger it.
    types: [opened, synchronize, reopened, edited]
  # GitHub dispatches `merge_group` only when a merge queue is enabled. That has
  # happened: two entries were dispatched on 2026-08-04 against base db03fbf1,
  # 54 seconds apart, and both were cancelled --
  #
  #   30889162530  gh-readonly-queue/development/pr-227-db03fbf1  07:46:33Z
  #   30889221719  gh-readonly-queue/development/pr-221-db03fbf1  07:47:27Z
  #
  # `required_merge_queue` is absent from branch protection now, so the queue
  # was enabled, dispatched those two, and was turned off again. What cancelled
  # them is not established and this comment does not guess; ci.yml declared no
  # `concurrency:` at the time, so it was not this file.
  #
  # The previous wording here read "Inert until a merge queue exists", which is
  # defensible as written but reads as "this branch has never executed" -- and a
  # reviewer relied on it and stated a false premise. Without this trigger a
  # queued entry's required contexts are never reported and the queue hangs
  # rather than fails. See tests/ciWorkflowTriggers.test.ts.
  # The `edited` trigger above is itself gated by tests/bodyEditTriggers.test.ts,
  # which fails if any of the four types is dropped (#436).
  merge_group:

concurrency:
  # Unique per pull request AND per merge-queue entry. `github.ref` is
  # `refs/pull/N/merge` for a pull_request, and
  # `refs/heads/gh-readonly-queue/<base>/pr-N-<sha>` for a merge_group, so two
  # queued entries never share a group and cannot cancel one another -- the
  # failure mode tests/ciWorkflowTriggers.test.ts bans the unkeyed form for.
  group: ci-${{ github.ref }}
  # Only a pull_request run may be cancelled. A merge_group entry must reach a
  # conclusion: `cancelled` is not a success conclusion, so cancelling one
  # evicts the entry from the queue for a reason unrelated to its own changes.
  # Push runs on the long-lived branches are release inputs and are likewise
  # never cancelled. Superseding a stale pull_request run is the entire point:
  # without it a run that is still in flight when its head is replaced still
  # publishes a green, and that green is attributed to a commit that is no
  # longer the head (#405).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Read-only, and only used by the closing-reference declaration check below.
  pull-requests: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Guarded to pull_request because no PR context exists under merge_group
      # or push. An unguarded step here would fail every queued entry, which is
      # the deadlock #122 removed from this file -- do not drop the condition.
      - name: Closing-reference declaration
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:closing-references -- ${{ github.event.pull_request.number }}
      - name: Install dependencies
        id: npm_ci
        env:
          NPM_CLEANUP_EVIDENCE_PATH: ${{ runner.temp }}/npm-cleanup-evidence.json
        run: node scripts/npm-ci-strict.mjs

      - name: Upload npm cleanup failure evidence
        if: failure() && steps.npm_ci.outputs.cleanup_evidence == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-cleanup-evidence-${{ github.job }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-cleanup-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Calibration provenance
        run: npm run check:provenance

      - name: Target profile bundle
        run: npm run verify:target-profiles

      - name: Script reachability
        run: npm run check:script-reachability

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Test
        run: npm run test

  sidecar:
    name: Sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (sqlite feature)
        run: cargo clippy --locked --all-targets --features sqlite -- -D warnings

      - name: Clippy (step feature)
        run: cargo clippy --locked --all-targets --features step -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test (sqlite feature)
        run: cargo test --locked --features sqlite

      - name: Test (step feature)
        run: cargo test --locked --features step

      - name: Build (lib3mf feature)
        if: runner.os == 'Windows'
        run: cargo build --locked --features lib3mf

      - name: Test (lib3mf feature)
        if: runner.os == 'Windows'
        run: cargo test --locked --features lib3mf

  package:
    name: Release package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        id: npm_ci
        env:
          NPM_CLEANUP_EVIDENCE_PATH: ${{ runner.temp }}/npm-cleanup-evidence.json
        run: node scripts/npm-ci-strict.mjs

      - name: Upload npm cleanup failure evidence
        if: failure() && steps.npm_ci.outputs.cleanup_evidence == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-cleanup-evidence-${{ github.job }}-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-cleanup-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Build sidecar (release)
        working-directory: native
        run: cargo build --locked --release -p model-core --features sqlite

      - name: Package app (bundles the prebuilt sidecar)
        env:
          # The sidecar is built in the dedicated step above; the packaging
          # hook only needs to stage it.
          PRINTFARMER_SKIP_SIDECAR_BUILD: '1'
          # Dialog responses are compiled into CI-only packages so ordinary
          # release packages cannot enable automation through the environment.
          PRINTFARMER_BUILD_E2E: '1'
        run: npm run package

      - name: Verify SBOM reproduces from the lockfiles
        # Runs here rather than in `desktop` because this is the only job with
        # both toolchains, so it is the only one where the cargo half of the
        # SBOM is derived from a real `cargo metadata` resolution at the
        # feature set a release builds.
        run: npm run verify:sbom

      - name: Verify third-party licence policy
        # Deterministic gate: every shipped component's licence must be
        # compatible with the AGPL-3.0-only outbound licence or hold a reviewed
        # exception. Reads the SBOM `npm run package` staged above.
        run: npm run verify:licenses

      - name: Verify third-party notices reproduce from the SBOM
        run: npm run verify:notices

      - name: Verify packaged sidecar and compliance resources
        run: node scripts/verify-packaged-sidecar.mjs

      - name: Verify committed lockfiles are unchanged
        run: git diff --exit-code -- native/Cargo.lock package-lock.json

      - name: Packaged Electron end-to-end tests
        run: npx playwright test --grep-invert "@gpu|@a11y"

      - name: Packaged accessibility (material WCAG A/AA)
        run: npx playwright test e2e/release.accessibility.spec.ts

      - name: Packaged WebGL2 (host default capability report)
        env:
          PRINTFARMER_E2E_GPU_MODE: default
        run: npx playwright test e2e/release.gpu.spec.ts

      - name: Packaged WebGL2 (SwiftShader fallback)
        env:
          PRINTFARMER_E2E_GPU_MODE: swiftshader
        run: npx playwright test e2e/release.gpu.spec.ts

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install dependencies
        id: npm_ci
        env:
          NPM_CLEANUP_EVIDENCE_PATH: ${{ runner.temp }}/npm-cleanup-evidence.json
        run: node scripts/npm-ci-strict.mjs

      - name: Upload npm cleanup failure evidence
        if: failure() && steps.npm_ci.outputs.cleanup_evidence == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-cleanup-evidence-${{ github.job }}-single-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-cleanup-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Generate SBOM (scopes advisories to what ships)
        run: npm run sbom

      # Report mode by design (see docs/security/THREAT_MODEL.md T4.2): advisory
      # databases are fetched live, so a newly published advisory must not
      # retroactively fail an unrelated pull request. Findings surface as
      # `::warning::` annotations and the job stays green. An inability to run
      # the audit — tool missing, unparseable output, registry unreachable —
      # still fails the job loudly rather than passing in silence. Before either
      # audit runs, the gate independently walks feature-resolved cargo metadata
      # and requires its exact name@version set to match the generated SBOM.
      - name: Audit shipped dependencies for known advisories
        run: npm run audit:advisories
