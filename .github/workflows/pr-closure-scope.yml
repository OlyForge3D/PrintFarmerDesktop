name: PR closure contracts

# merge-queue: reports
#
# Both contexts report for pull requests and merge-queue entries, so either is
# eligible for required-check configuration. scripts/check-merge-queue-contexts.mjs
# enforces that classification under `npm run test`.

# Deliberately a separate workflow rather than jobs in ci.yml.
#
# Both checks need a pull request number or PR-derived fields. A pull_request
# event carries the number directly. A merge_group event carries it in the
# queue's standard `head_ref` (`.../pr-<number>-<sha>`), which
# resolvePullRequestNumber parses and tests. Neither check uses a skipped branch,
# so a queued entry receives a real verdict rather than a success-shaped skip.
#
# `edited` is in the type list for a reason found the hard way on this very
# pull request: `closingIssuesReferences` is derived from the pull request
# BODY, and a body can be rewritten with no commit and no push. The default
# type set (opened, synchronize, reopened) is commit-shaped, so without
# `edited` a pull request could pass this check, have a closing keyword typed
# into its description afterwards, and merge green — the check would never run
# again. That is the whole hazard, reachable by an edit box.
#
# Note that `types:` REPLACES the default set rather than extending it, so the
# three defaults are listed explicitly here. Writing `types: [edited]` alone
# would silently stop this workflow running on new pull requests at all, which
# is the failure mode this guard exists to prevent, applied to itself.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  closure-scope:
    name: Gate issue closure scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: the check imports nothing outside node: builtins, so it
      # runs against the checkout alone. That keeps it off the scarce
      # macos-latest pool and finishes in seconds rather than minutes.
      - name: Verify no gate issue is armed for closure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:closure-scope

  closing-references:
    name: Closing-reference declaration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # This is an independent context because a PR-body mismatch is not a
      # platform build failure and the gate-only check above measures a narrower
      # set. No `npm ci`: the script imports only node: builtins.
      - name: Compare declared and armed closing references
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:closing-references
