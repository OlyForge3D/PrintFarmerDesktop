name: Release (signed)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build unsigned artifacts without creating a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  make:
    name: Make (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: universal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Calibration provenance
        run: npm run check:provenance

      - name: Build Windows sidecar (release)
        if: runner.os == 'Windows'
        working-directory: native
        run: cargo build --locked --release -p model-core --features sqlite

      - name: Add universal macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build universal macOS sidecar (release)
        if: runner.os == 'macOS'
        run: node scripts/build-universal-sidecar.mjs

      - name: Package unsigned application
        env:
          PRINTFARMER_SKIP_SIDECAR_BUILD: '1'
          PRINTFARMER_SIDECAR_SOURCE: ${{ matrix.platform == 'darwin' && format('{0}/native/target/universal-apple-darwin/release/model-core', github.workspace) || '' }}
          PRINTFARMER_UPDATE_PUBLIC_KEY_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.UPDATE_SIGNING_PUBLIC_KEY_BASE64 || '' }}
        run: npm run package -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - name: Sign Windows package and build Squirrel installer
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_P12_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            throw 'Tagged releases require GitHub secret WINDOWS_CERTIFICATE_P12_BASE64'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Tagged releases require GitHub secret WINDOWS_CERTIFICATE_PASSWORD'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'printfarmer-release.p12'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $env:WINDOWS_CERTIFICATE_FILE = $certificatePath
            node scripts/release-environment.mjs `
              --allow WINDOWS_CERTIFICATE_FILE `
              --allow WINDOWS_CERTIFICATE_PASSWORD `
              -- node scripts/sign-windows-release.mjs `
              --app-directory "out/PrintFarmer Desktop-win32-x64" `
              --output-directory "out/make/squirrel.windows/x64"
            if ($LASTEXITCODE -ne 0) {
              throw "Windows signing process failed with exit code $LASTEXITCODE"
            }
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\WINDOWS_CERTIFICATE_FILE -ErrorAction SilentlyContinue
          }

      - name: Sign universal sidecar and macOS application
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CERTIFICATE_BASE64" ]] || missing+=(APPLE_CERTIFICATE_P12_BASE64)
          [[ -n "$CERTIFICATE_PASSWORD" ]] || missing+=(APPLE_CERTIFICATE_PASSWORD)
          [[ -n "$APPLE_SIGNING_IDENTITY" ]] || missing+=(APPLE_SIGNING_IDENTITY)
          if (( ${#missing[@]} )); then
            printf 'Tagged releases require GitHub secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/printfarmer-release.p12"
          keychain_path="$RUNNER_TEMP/printfarmer-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path"
          }
          trap cleanup EXIT
          printf '%s' "$CERTIFICATE_BASE64" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          export APPLE_SIGNING_KEYCHAIN="$keychain_path"
          node scripts/release-environment.mjs \
            --allow APPLE_SIGNING_IDENTITY \
            --allow APPLE_SIGNING_KEYCHAIN \
            -- node scripts/sign-macos-release.mjs \
            --app "out/PrintFarmer Desktop-darwin-universal/PrintFarmer Desktop.app" \
            --sidecar "out/PrintFarmer Desktop-darwin-universal/PrintFarmer Desktop.app/Contents/Resources/sidecar/model-core"

      - name: Notarize macOS application
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          node scripts/release-environment.mjs \
            --allow APPLE_ID \
            --allow APPLE_APP_SPECIFIC_PASSWORD \
            --allow APPLE_TEAM_ID \
            -- node scripts/notarize-macos-release.mjs \
            --app "out/PrintFarmer Desktop-darwin-universal/PrintFarmer Desktop.app"

      - name: Make Windows portable archive
        if: runner.os == 'Windows'
        run: npm run make -- --skip-package --platform=win32 --arch=x64 --targets=@electron-forge/maker-zip

      - name: Make macOS publishable archives
        if: runner.os == 'macOS'
        run: npm run make -- --skip-package --platform=darwin --arch=universal --targets=@electron-forge/maker-zip,@electron-forge/maker-dmg

      - name: Verify Windows Authenticode signatures
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $signTool = Resolve-Path 'node_modules/@electron/windows-sign/vendor/signtool.exe'
          $files = @(
            Get-ChildItem out -Recurse -File |
              Where-Object { $_.Name -eq 'PrintFarmer Desktop.exe' -or $_.Name -like '*Setup.exe' }
          )
          if ($files.Count -lt 2) { throw 'Expected both packaged app and Setup.exe for signature verification' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($file.FullName): $($signature.Status)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Missing RFC 3161 timestamp on $($file.FullName)"
            }
            $verification = (& $signTool verify /pa /all /v $file.FullName 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) {
              throw "SignTool verification failed for $($file.FullName):`n$verification"
            }
            if ($verification -notmatch '(?im)^Hash of file \(sha256\):') {
              throw "Signature on $($file.FullName) does not use a SHA-256 file digest"
            }
          }

      - name: Verify universal app, nested sidecar, and notarization
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find out -type d -name 'PrintFarmer Desktop.app' -print -quit)"
          [[ -n "$app_path" ]] || { echo 'Packaged app not found' >&2; exit 1; }
          sidecar="$app_path/Contents/Resources/sidecar/model-core"
          lipo -verify_arch x86_64 arm64 "$sidecar"
          codesign --verify --strict --verbose=2 "$sidecar"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Verify SBOM reproduces from the lockfiles
        run: npm run verify:sbom

      - name: Verify third-party licence policy
        run: npm run verify:licenses

      - name: Verify third-party notices reproduce from the SBOM
        run: npm run verify:notices

      - name: Verify packaged sidecar and compliance resources
        run: node scripts/verify-packaged-sidecar.mjs

      - name: Verify committed lockfiles are unchanged
        run: git diff --exit-code -- native/Cargo.lock package-lock.json

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r -d '' artifact; do
            file_name="$(basename "$artifact")"
            safe_name="$(printf '%s' "$file_name" | sed -E 's/[^A-Za-z0-9._-]+/./g; s/^\.+//; s/\.+$//')"
            [[ -n "$safe_name" ]] || { echo "Artifact name cannot be normalized: $file_name" >&2; exit 1; }
            [[ ! -e "dist/$safe_name" ]] || { echo "Artifact name collision after normalization: $safe_name" >&2; exit 1; }
            cp "$artifact" "dist/$safe_name"
          done < <(find out/make -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0)
          test -n "$(find dist -type f -print -quit)"
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: printfarmer-desktop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Sign metadata and publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: printfarmer-desktop-*
          path: dist
          merge-multiple: true

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
            echo "Release tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          }

      - name: Generate signed update metadata
        shell: bash
        env:
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
          PRINTFARMER_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$UPDATE_SIGNING_PRIVATE_KEY_BASE64" ]] || { echo 'UPDATE_SIGNING_PRIVATE_KEY_BASE64 is required' >&2; exit 1; }
          [[ -n "$PRINTFARMER_UPDATE_PUBLIC_KEY_BASE64" ]] || { echo 'UPDATE_SIGNING_PUBLIC_KEY_BASE64 is required' >&2; exit 1; }
          version="$(node -p "require('./package.json').version")"
          published_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          node scripts/release-environment.mjs \
            --allow UPDATE_SIGNING_PRIVATE_KEY_BASE64 \
            --allow PRINTFARMER_UPDATE_PUBLIC_KEY_BASE64 \
            -- node scripts/generate-update-metadata.mjs \
              --artifacts dist \
              --version "$version" \
              --tag "$GITHUB_REF_NAME" \
              --published-at "$published_at" \
              --output dist

      - name: Publish signed release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Signed release:
            - Windows app and installer carry Authenticode signatures.
            - The universal macOS app and nested Rust sidecar are signed, notarized, and stapled.
            - `latest.json` is signed by `latest.json.sig`; the app verifies it before staging an update.
