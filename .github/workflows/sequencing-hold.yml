name: Sequencing hold

# merge-queue: reports
#
# #480: this workflow now subscribes to merge_group (below), so its check run
# is eligible to be a required context — the reason pr-closure-scope.yml
# stays "advisory" no longer applies here, because that reason was narrowly
# "does not run under merge_group", and that is now false for this workflow.
# scripts/check-merge-queue-contexts.mjs holds this classification, enforced
# by tests/mergeQueueReadiness.test.ts under `npm run test`; its live
# branch-protection comparison is wired into a step in ci.yml's `advisories`
# job (#186, #472 — that comparison used to have no call site at all), though
# that step only actually compares once a repo-admin-scoped token is
# configured there — see that step's own comment.
#
# "Sequencing hold" is now required on `development`. The retained session-
# trailer and body-edit-trigger guards run in this existing context too, so
# retiring the closing-declaration context does not weaken those policies.

# Deliberately a separate workflow rather than a job in ci.yml, for the same
# reason pr-closure-scope.yml is: the check needs a pull request number and a
# pull request's labels, and `push` carries neither. (`merge_group` DOES carry
# a resolvable PR number as of the subscription added below — see that
# comment — but ci.yml's jobs are still the wrong home for a check keyed on
# labels, which ci.yml's build/test jobs are not.)
# Adding it to ci.yml would have required a job-level `if:` or a
# `github.event_name` branch, both of which tests/ciWorkflowTriggers.test.ts
# bans outright — a job skipped by a conditional reports `skipped`, which counts
# as success, so the required context would be satisfied by a job that never ran.
#
# `labeled` and `unlabeled` are the load-bearing entries in the type list.
#
# A hold is applied and released by adding or removing a label. That is not a
# commit: there is no push, no new head, and no `synchronize` event. With only
# the commit-shaped defaults this workflow would run once when the pull request
# opened, report "not held", and never run again — so a hold applied afterwards
# would be invisible, and a hold RELEASED afterwards would leave the check red
# forever with no way to clear it but an empty commit.
#
# This is the same hazard pr-closure-scope.yml found for `edited`, arriving
# through a different door: the state being checked can change with no commit,
# so a commit-shaped trigger set cannot see it. Recorded here rather than
# re-derived.
#
# Note that `types:` REPLACES the default set rather than extending it, so the
# three defaults are listed explicitly alongside the two that matter.
#
# `merge_group:` is left on its default configuration deliberately:
# a merge-queue entry carries no label to
# check (the queue's own ref has none), but check-sequencing-hold.mjs does not
# need one either — it reads the PR's labels via the REST API, keyed off the
# PR number resolvePullRequestNumber() recovers from the queue's
# `refs/heads/gh-readonly-queue/<branch>/pr-<N>-<sha>` head ref (the same
# resolver pr-closure-scope.yml already uses). Without this trigger, a
# required "Sequencing hold" context would never report for a queued entry —
# the entry would hang Pending forever rather than fail (#122) — which is
# exactly why this context was NOT required until this subscription existed.
# tests/sequencingHold.test.ts and tests/mergeQueueReadiness.test.ts pin the
# subscription so the constraint is checked rather than remembered.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  sequencing-hold:
    name: Sequencing hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify body-edit trigger coverage
        run: npm run check:body-edit-triggers

      - name: Validate Copilot session trailers
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:copilot-session-trailers

      # No `npm ci`: the checks import nothing outside node: builtins, so the job
      # runs against the checkout alone. That keeps it off the scarce
      # macos-latest pool and finishes in seconds rather than minutes.
      - name: Verify the pull request is not deliberately held
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:sequencing-hold
