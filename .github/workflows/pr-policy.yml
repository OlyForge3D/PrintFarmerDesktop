name: PR policy

# merge-queue: reports

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify body-edit trigger coverage
        run: npm run check:body-edit-triggers

      - name: Validate Copilot session trailers
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:copilot-session-trailers
