name: Closing-reference declaration

# merge-queue: reports
#
# This workflow reports a real verdict for pull requests and merge-queue
# entries, so its context is eligible for required-check configuration.
# tests/mergeQueueReadiness.test.ts imports
# scripts/check-merge-queue-contexts.mjs and enforces that classification.
#
# A pull_request event carries its number directly. A merge_group event carries
# it in the queue's standard `head_ref` (`.../pr-<number>-<sha>`), which the
# shared resolver parses and the end-to-end test drives through the CLI boundary.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  closing-references:
    name: Closing-reference declaration
    runs-on: ubuntu-latest
    steps:
      # On pull_request, actions/checkout@v4 defaults to the ephemeral
      # refs/pull/<n>/merge test-merge commit, not the PR's literal head
      # tree. #415's declaration file must be judged against the exact head
      # commit the PR reports as its head, not a merge of it with whatever
      # development has advanced to since; pin the ref explicitly so a
      # concurrent, non-conflicting edit to the shared declaration file on
      # another PR can never be folded into what this job reads. merge_group
      # is intentionally left on its default ref: that ref *is* the queue's
      # own multi-PR merge commit, which is what a merge-queue run must
      # judge.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Independent because a PR-body mismatch is not a platform build failure.
      # No `npm ci`: the script imports only node: builtins.
      - name: Verify body-edit trigger coverage
        run: npm run check:body-edit-triggers

      # scripts/check-closing-references.mjs (#563): exit 0 = matches, exit 1
      # = a genuine declared-vs-armed mismatch, exit 2 = no verdict (the
      # script never got far enough to compare -- no PR/git context, an
      # unresolvable PR number, an unreadable declaration file, or an
      # unreadable API response). This is a bare `run:` step with no
      # exit-code branching, so any nonzero exit already fails the job --
      # exit 2 must stay that way; do not add logic here that treats it as a
      # soft pass.
      - name: Compare declared and armed closing references
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:closing-references

      - name: Validate Copilot session trailers
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:copilot-session-trailers
