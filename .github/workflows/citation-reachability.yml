name: Citation reachability

# merge-queue: advisory
#
# Runs on pull_request and on push to development, emits a check run, and does
# NOT report for a queued entry, so this context MUST NOT be added to a branch
# ruleset's required contexts. The workflow's `run:` step invokes
# `npm run check:citation-reachability`; the context checker enforces the
# resulting agreement against live branch protection.
# Advisory is load-bearing here rather than incidental: the push arm below runs
# on the branch a queue would gate, and a required context that reports on push
# but not for a queued entry is the deadlock #122 describes.

# Deliberately a separate workflow rather than a job in ci.yml.
#
# The check needs the full commit graph and a mainline ref: it classifies each
# cited revision as reachable from what a reader holds, twinned to a live commit
# by `git patch-id --stable`, declared with a fetch route, or orphaned. All three
# of the passing classes need history that a depth-1 checkout does not have, and
# ci.yml's jobs are depth-limited because nothing else in them reads the graph.
#
# Why this exists at all, stated here because the failure is invisible from the
# position that creates it. Several worktrees can share one object database, so a
# revision orphaned by a rebase keeps resolving for whoever wrote the citation
# and resolves for nobody else. `git show` does not error, hesitate, or warn. The
# author is therefore the one party who cannot detect that their own pin has
# died, which makes "check it before you push" the one control that cannot work.
# It has to run somewhere the author is not.
#
# The harness withholds its verdict unless both of its controls fire - a
# known-present revision must classify REACHABLE and a synthetic one must
# classify ORPHAN - and exits 2 if either fails. Those classifier controls are
# necessary rather than sufficient: they run on inputs the harness supplies
# itself, so they cannot detect an empty real input set. Distinguishing "no
# orphans" from "cannot see orphans" requires three independent guard families:
# classifier controls; the shallow-history refusal plus MAINLINE_FLOOR for the
# reader; and scan-root preflights plus corpus-specific floors for the inputs.
# The local arm uses CITATION_FLOOR. Each guard covers a different way of
# seeing nothing, and none implies the others.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # #428. The pull_request arm alone is a non-instrument for this defect, and
  # not because it is weak: it is on the side where the failure cannot exist.
  # A PR head still has its branch, so a self-citation is reachable there and
  # the harness exits 0. Squash-merging that PR and deleting the branch is the
  # operation that orphans the citation -- so the check passed, then the merge
  # falsified what it had passed, and the trigger set contained no event that
  # could ever observe the result. The push arm runs after the destroying
  # operation, which is the only position from which this is visible.
  push:
    branches: [development]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  citation-reachability:
    name: Citation reachability
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 for the graph; `ref:` because the default pull_request
      # checkout is the merge commit, whose ancestry is not the branch's. The
      # twin index is built over the branch's own commits, so measuring it
      # against a synthetic merge would index the wrong set.
      #
      # The fallback is what makes the push arm real rather than nominal. On
      # push there is no `pull_request` object, so the expression on the left is
      # the empty string and `ref:` would silently mean "the default", which for
      # a push happens to be right and for a schedule would not be. Naming
      # `github.sha` says which commit is under test on every event instead of
      # relying on a default that differs per event.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The mainline is half of the reader model. Fetched by name and pinned to
      # a local ref the harness looks for: without it the run silently narrows to
      # HEAD alone, which is stricter and would report orphans that a reader can
      # in fact reach. A check that fails for the wrong reason teaches people to
      # ignore it.
      #
      # The name is resolved into an env var and asserted non-empty rather than
      # interpolated straight into the refspec. On push there is no
      # `pull_request` object, and an empty expression would build
      # `+refs/heads/:refs/...`, which git rejects with a message about a
      # malformed refspec -- a red that names the wrong thing and would be read
      # as this check being broken rather than as the trigger being wrong.
      - name: Fetch the mainline the reader is assumed to hold
        env:
          MAINLINE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          if [ -z "${MAINLINE_REF}" ]; then
            echo "::error::Citation reachability: no mainline ref for event '${GITHUB_EVENT_NAME}'. The reader model needs a branch name; refusing rather than fetching a malformed refspec."
            exit 1
          fi
          echo "event=${GITHUB_EVENT_NAME} mainline_ref=${MAINLINE_REF}"
          git fetch --no-tags origin \
            "+refs/heads/${MAINLINE_REF}:refs/remotes/origin/development"
          git rev-parse --verify refs/remotes/origin/development^{commit}

      # Condition 4 of the discharge path stated in UNENFORCED_CHECKS
      # (scripts/check-script-reachability.mjs): assert the reachable-commit
      # count. The step above proves the ref is present. Presence is not depth,
      # and every class this harness assigns - REACHABLE, TWIN, DECLARED - is
      # defined over history rather than over a ref, so a checkout that resolves
      # every name and holds almost no commits answers the question wrongly
      # while looking correct.
      #
      # The harness already refuses a shallow clone on its own (exit 2,
      # INCONCLUSIVE - measured), so that arm is covered and this step does not
      # claim it. What is not covered is a checkout that is not flagged shallow
      # and is still narrow: `git rev-parse --is-shallow-repository` reports how
      # the repository was created, not how much of the graph a later step left
      # behind. This asserts the quantity directly and prints it, so a run that
      # passes says how much it looked at instead of only that it looked.
      - name: Assert the checkout holds history, not just the refs
        env:
          MAINLINE_FLOOR: '250'
        run: |
          shallow="$(git rev-parse --is-shallow-repository)"
          mainline="$(git rev-list --count refs/remotes/origin/development)"
          head="$(git rev-list --count HEAD)"
          echo "shallow=${shallow} mainline=${mainline} head=${head} floor=${MAINLINE_FLOOR}"
          if [ "${shallow}" != "false" ]; then
            echo "::error::Shallow checkout: reachability is undecidable here, and the count below is not a measurement of this repository's history."
            exit 1
          fi
          if [ "${mainline}" -lt "${MAINLINE_FLOOR}" ] || [ "${head}" -lt "${MAINLINE_FLOOR}" ]; then
            echo "::error::Checkout holds ${mainline} mainline / ${head} head commits, under the floor of ${MAINLINE_FLOOR}. The graph narrowed; a green from this run would mean 'found no orphans in the part I still have'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: the harness imports nothing outside node: builtins and
      # shells out to git, so it runs against the checkout alone.
      - name: Verify every cited revision is reachable, twinned, or declared
        run: npm run check:citation-reachability

      # A deliberately separate step from the one above, and a deliberately separate script
      # (#528). Reachability answers "can a reader reach this revision"; this answers "does the
      # content it names still say what the citation claims" -- and the two must never share an
      # exit code, because a reachability failure is repaired by declaring a twin and a content
      # failure is repaired by editing the prose. Folding them into one step would make a single
      # red ambiguous between those two remedies.
      - name: Verify pinned content assertions against their cited commits
        run: npm run check:citation-content
