<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy is enforced authoritatively by the Electron main
      process via a session response header (see src/main/security.ts). It is
      strict in production and relaxed only for the Vite dev server in
      development, so it is intentionally not duplicated as a static meta tag
      here (a hardcoded strict meta tag would block Vite's dev preamble).
    -->
    <title>PrintFarmer Desktop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
